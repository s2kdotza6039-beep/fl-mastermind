# Studio Sensei — Netlify configuration (recommended host).
# Build the Vite app and serve `dist` as a single-page app (client-side routing).
[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Long-cache hashed assets, never cache the HTML entry.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
